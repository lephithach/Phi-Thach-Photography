<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lì xì túi mù</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap");

      body {
        min-width: 400px;
        width: 500px;
        max-width: 100%;
        height: 100vh;
        margin: 0 auto;
        /* background-color: #d64012; */
        background: linear-gradient(90deg, #ea580c 0%, #b91c1c 100%);
        color: white;
        /* animation: bling 2s infinite ease-in-out; */
      }

      @media screen and (max-width: 769px) {
        body {
          width: 100%;
        }
      }

      /* @keyframes bling {
        0% {
          background: linear-gradient(70deg, #ea580c 0%, #b91c1c 100%);
        }
        25% {
          background: linear-gradient(50deg, #ea580c 0%, #b91c1c 100%);
        }
        50% {
          background: linear-gradient(30deg, #ea580c 0%, #b91c1c 100%);
        }
        75% {
          background: linear-gradient(15deg, #ea580c 0%, #b91c1c 100%);
        }
        100% {
          background: linear-gradient(0deg, #ea580c 0%, #b91c1c 100%);
        }
      } */

      .header {
        font-family: "Dancing Script", serif;
        font-weight: bold;
        font-size: 5rem;
        color: #fffb00;
        margin-top: 1rem !important;
        text-decoration: none;
      }

      .form-control,
      .form-select {
        background-color: #d64012;
        color: #fff;
      }

      .form-control:focus {
        background-color: #d64012;
        color: #fff;
      }

      button.submit {
        /* background-color: #fffb00; */
        background-image: url("./vendor/mp3/tui-mu.png");
        background-repeat: no-repeat;
        background-size: cover;
        width: 100%;
        height: 200px;
        max-height: 300px;
        background-color: transparent;
        /* object-fit: cover; */
        object-fit: contain;
        /* color: #b91c1c; */
        /* padding: 10px 20px; */
        padding: 0 !important;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .submit {
        width: 100%;
        cursor: pointer;
      }

      .qr-code {
        border-radius: 1rem;
      }

      .modal-container {
        position: fixed;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        animation: fadeIn 0.5s ease-out;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .modal-container.none {
        display: none;
      }

      .modal-popup {
        display: fixed;
        height: 100%;
        z-index: 1;
        background: linear-gradient(90deg, #ea580c 0%, #b91c1c 100%);
        padding: 20px;
      }

      .modal-popup h1 {
        color: #fffb00;
        font-family: "Dancing Script", serif;
      }

      .modal-popup button {
        color: #d64012;
        background-color: #fffb00;
        border: none;
      }

      .modal-popup p {
        font-size: 2rem;
        color: #fffb00;
        font-family: "Dancing Script", serif;
      }

      .modal-popup .count-down {
        font-size: 4rem;
        color: #fffb00;
        font-family: "Dancing Script", serif;
      }
    </style>
  </head>
  <body>
    <div class="modal-container none">
      <div class="modal-popup">
        <p class="text-center">Chúc Mừng Năm Mới</p>
        <p class="text-center">Chúc bạn năm mới phát tài phát lộc</p>
        <p class="text-center">Hãy chờ đón xem vận may của bạn</p>
        <p class="count-down text-center"></p>
      </div>
    </div>

    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12">
          <h1 class="text-center mt-5 header">
            <a href="./" class="header">Lì xì túi mù</a>
          </h1>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <form action="#" method="get">
            <div class="form-group mb-2">
              <label for="idbank">Nhập số tài khoản</label>
              <input
                type="number"
                class="form-control"
                id="idbank"
                name="idbank"
                required
              />
            </div>

            <div class="form-group mb-2">
              <label for="bankname">Chọn ngân hàng</label>
              <select
                name="bankname"
                id="bankname"
                class="form-select"
                required
              >
                <!-- <option value="vietcombank">Vietcombank</option> -->
              </select>
            </div>

            <div class="form-group">
              <!-- <button class="submit">&nbsp;</button> -->
              <img src="./vendor/mp3/tui-mu.png" class="submit" alt="tuimu" />
            </div>
          </form>
        </div>
      </div>

      <div class="row">
        <div class="col-md-12 tuimu">
          <img src="#" class="qr-code w-100 mt-3" alt="" />
        </div>
      </div>

      <div class="row">
        <div class="col-md-12">
          <p class="text-center">
            <a
              href="https://www.facebook.com/lephiithach/"
              target="_blank"
              style="color: white; text-decoration: none"
              >Made by Phi Thach</a
            >
          </p>
        </div>
      </div>

      <audio autoplay loop id="audio">
        <source src="./vendor/mp3/thu-y.mp3" type="audio/mpeg" />
      </audio>
    </div>

    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/axios.min.js"></script>
    <script>
      const idbank = document.getElementById("idbank");
      const bankname = document.getElementById("bankname");
      const button = document.querySelector(".submit");
      const qrCode = document.querySelector(".qr-code");
      const audioElement = document.getElementById("audio");
      const countdownElement = document.querySelector(".count-down");

      // Play audio
      idbank.addEventListener("click", function () {
        audioElement.play();
      });

      // Get list bank
      axios({
        method: "get",
        url: "https://api.vietqr.io/v2/banks",
      }).then(function (response) {
        let data = response.data.data;

        data.forEach((bank) => {
          bankname.innerHTML += `
          <option value="${bank.code}">${bank.shortName}</option>
          `;
        });
      });

      // Check exist localStorage
      // if (localStorage.getItem("isClick") === "1") {
      //   button.style.display = "none";
      // }

      button.addEventListener("click", function (e) {
        e.preventDefault();

        // Check empty idbank input
        if (idbank.value === "") {
          alert("Vui lòng nhập số tài khoản");
          return;
        }

        // Check exist localStorage
        if (localStorage.getItem("isClick") === "1") {
          alert("Bạn đã mở túi mù rồi, hẹn gặp bạn ở năm sau");
          return;
        } else {
          let randomNumber = Math.floor(Math.random() * (200 - 10 + 1)) + 10;
          //   đơn vị nghìn đồng
          let money = randomNumber * 1000;
          let idBankValue = idbank.value;
          let bankNameValue = bankname.value;

          // Gọi hàm đếm ngược
          countdown(countdownElement);

          // Show qr code after 2s
          setTimeout(() => {
            qrCode.src = `https://img.vietqr.io/image/${bankNameValue}-${idBankValue}-compact2.jpg?amount=${money}`;
            button.style.display = "none";
          }, 2000);

          // Save to localStorage
          localStorage.setItem("isClick", "1");
        }
      });

      // Hàm đếm ngược
      const countdown = (countdownElement) => {
        let modalContainer = document.querySelector(".modal-container");
        modalContainer.classList.remove("none");
        // Thời gian bắt đầu (10 giây)
        let timeLeft = 10;

        // Hàm đếm ngược
        const countdownTimer = setInterval(() => {
          timeLeft--; // Giảm thời gian còn lại
          countdownElement.innerHTML = timeLeft; // Cập nhật giao diện

          if (timeLeft <= 0) {
            modalContainer.classList.add("none");
            clearInterval(countdownTimer); // Dừng đếm ngược
          }
        }, 1000); // Cứ mỗi giây chạy một lần
      };
    </script>
  </body>
</html>
